<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1a1a2e;
        --muted: #6b7280;
        --accent: #4a9eff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1221;
          --text: #e8eaf0;
          --muted: #a8b2d8;
        }
      }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
      body {
        font: 17px/1.6 Montserrat, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 720px; margin: 0 auto; padding: 96px 24px 72px; }
      h1 { font-size: 1.9rem; line-height: 1.25; margin: 0 0 12px; }
      p { margin: 0 0 18px; color: var(--muted); }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>There is nothing at this address. The whole site lives on one page.</p>
      <p><a href="/">Go to danialrp.com</a></p>
    </main>
  </body>
</html>
